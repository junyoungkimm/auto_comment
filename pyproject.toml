[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "track2-comment-agent"
version = "0.1.0"
description = "유튜브 댓글 에이전트 대시보드 (제이지그룹 AI PM 과제 TRACK 2)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "playwright>=1.48",
    "youtube-transcript-api>=1.0",
    # 댓글 게시 · 인기 댓글 · 키워드 검색 (YouTube Data API, OAuth)
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
